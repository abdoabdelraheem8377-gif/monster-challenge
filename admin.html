<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الأدمن - 7 أرقام التحويل</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      background: #07040F;
      color: #FFFFFF;
      font-family: Tahoma, Arial, sans-serif;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
    }
    .card {
      background: #140D24;
      border: 1px solid #FFD70066;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    h1, h2 {
      color: #FFD700;
      margin-top: 0;
      text-align: center;
    }
    .muted {
      color: #C2B8D9;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
    .ph-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1B1130;
      border: 1px solid #3D2B68;
      border-radius: 9px;
      padding: 8px;
      margin-top: 8px;
    }
    .ph-num {
      color: #FFD700;
      font-weight: bold;
      min-width: 56px;
      font-size: 13px;
    }
    .ph-box input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #FFD700;
    }
    .ph-box input[type="tel"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #483575;
      background: #090512;
      color: #FFFFFF;
      font-size: 15px;
      direction: ltr;
    }
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #FFD700;
      color: #07040F;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .msg {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      color: #6EE7A8;
      min-height: 18px;
    }
    .err {
      text-align: center;
      font-size: 13px;
      margin-top: 6px;
      color: #FF8FA3;
      min-height: 18px;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>👾 لوحة الأدمن</h1>
      <div class="muted">أدخل 7 أرقام لاستلام التحويلات، وحدد علامة الصح أمام 3 أرقام لتظهر للاعبين:</div>

      <div id="sevenPhonesBox">
        <div class="ph-box"><span class="ph-num">رقم 1</span><input type="checkbox" class="pick3" onchange="limitThree(this)"><input type="tel" class="inp7" placeholder="اكتب رقم التحويل 1"></div>
        <div class="ph-box"><span class="ph-num">رقم 2</span><input type="checkbox" class="pick3" onchange="limitThree(this)"><input type="tel" class="inp7" placeholder="اكتب رقم التحويل 2"></div>
        <div class="ph-box"><span class="ph-num">رقم 3</span><input type="checkbox" class="pick3" onchange="limitThree(this)"><input type="tel" class="inp7" placeholder="اكتب رقم التحويل 3"></div>
        <div class="ph-box"><span class="ph-num">رقم 4</span><input type="checkbox" class="pick3" onchange="limitThree(this)"><input type="tel" class="inp7" placeholder="اكتب رقم التحويل 4"></div>
        <div class="ph-box"><span class="ph-num">رقم 5</span><input type="checkbox" class="pick3" onchange="limitThree(this)"><input type="tel" class="inp7" placeholder="اكتب رقم التحويل 5"></div>
        <div class="ph-box"><span class="ph-num">رقم 6</span><input type="checkbox" class="pick3" onchange="limitThree(this)"><input type="tel" class="inp7" placeholder="اكتب رقم التحويل 6"></div>
        <div class="ph-box"><span class="ph-num">رقم 7</span><input type="checkbox" class="pick3" onchange="limitThree(this)"><input type="tel" class="inp7" placeholder="اكتب رقم التحويل 7"></div>
      </div>

      <div id="errBox" class="err"></div>
      <button type="button" class="btn" onclick="saveSevenPhones()">حفظ الـ 7 أرقام</button>
      <div id="msgBox" class="msg"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCHTbDGlhQu4G1YWPksojwLjGHVHiPGRyM",
      authDomain: "monester-challenge.firebaseapp.com",
      databaseURL: "https://monester-challenge-default-rtdb.firebaseio.com",
      projectId: "monester-challenge",
      storageBucket: "monester-challenge.firebasestorage.app",
      messagingSenderId: "258204342725",
      appId: "1:258204342725:web:17877d4b3778d6b08e13ac",
      measurementId: "G-RW050GJMCZ"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function limitThree(el) {
      const errBox = document.getElementById('errBox');
      const checked = Array.from(document.querySelectorAll('.pick3')).filter(function (c) { return c.checked; });
      if (checked.length > 3) {
        el.checked = false;
        errBox.textContent = 'مسموح باختيار 3 أرقام فقط لتظهر للاعبين.';
        setTimeout(function () { errBox.textContent = ''; }, 2500);
      } else {
        errBox.textContent = '';
      }
    }

    db.ref('settings').once('value').then(function (snap) {
      if (!snap.exists()) return;
      const s = snap.val();
      const pool = Array.isArray(s.phonePool) ? s.phonePool : [];
      const active = Array.isArray(s.activePhones) ? s.activePhones : [];
      const inputs = document.querySelectorAll('.inp7');
      const checks = document.querySelectorAll('.pick3');
      for (let i = 0; i < 7; i++) {
        const val = pool[i] || '';
        if (inputs[i]) inputs[i].value = val;
        if (checks[i]) checks[i].checked = val ? active.includes(val) : false;
      }
    }).catch(function () {});

    function saveSevenPhones() {
      const msgBox = document.getElementById('msgBox');
      const errBox = document.getElementById('errBox');
      msgBox.textContent = '';
      errBox.textContent = '';

      const inputs = document.querySelectorAll('.inp7');
      const checks = document.querySelectorAll('.pick3');
      const phonePool = [];
      const activePhones = [];

      for (let i = 0; i < 7; i++) {
        const val = inputs[i] ? inputs[i].value.trim() : '';
        phonePool.push(val);
        if (val && checks[i] && checks[i].checked && activePhones.length < 3) {
          activePhones.push(val);
        }
      }

      if (!activePhones.length) {
        phonePool.filter(Boolean).slice(0, 3).forEach(function (p) { activePhones.push(p); });
      }

      db.ref('settings').update({
        phonePool: phonePool,
        activePhones: activePhones,
        transferPhone: activePhones[0] || '',
        updatedAt: Date.now()
      }).then(function () {
        msgBox.textContent = 'تم حفظ الـ 7 أرقام بنجاح!';
      }).catch(function (e) {
        errBox.textContent = 'تعذر الحفظ: ' + e.message;
      });
    }
  </script>
</body>
</html>
