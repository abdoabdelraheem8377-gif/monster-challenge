<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صراع الوحوش</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 15px;
      background: #07040F;
      color: #FFFFFF;
      font-family: Tahoma, Arial, sans-serif;
    }
    .wrap {
      max-width: 490px;
      margin: 0 auto;
      background: #140D24;
      border: 1px solid #FFD70055;
      border-radius: 14px;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
      color: #FFD700;
      margin-top: 0;
    }
    .center {
      text-align: center;
    }
    .muted {
      color: #C2B8D9;
      font-size: 14px;
      line-height: 1.6;
    }
    .timer-box {
      font-size: 42px;
      font-weight: bold;
      color: #FFD700;
      background: #1E1436;
      border: 1px solid #FFD70088;
      border-radius: 14px;
      padding: 12px 26px;
      display: inline-block;
      margin: 16px auto;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-size: 14px;
      color: #FFE99E;
      font-weight: bold;
    }
    input[type="text"], input[type="tel"], select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #433269;
      background: #090512;
      color: #FFFFFF;
      font-size: 15px;
      font-family: Tahoma, Arial, sans-serif;
    }
    .row-2 {
      display: flex;
      gap: 8px;
    }
    .row-2 > * {
      flex: 1;
    }
    .member-box {
      background: #1E1436;
      border: 1px solid #392861;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-gold {
      background: #FFD700;
      color: #07040F;
    }
    .btn-dark {
      background: #291C47;
      color: #FFFFFF;
      border: 1px solid #4B367A;
    }
    .msg-err {
      color: #FF7A90;
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- الشاشة 1: العد التنازلي 30 ثانية -->
    <div id="s1" class="center" style="padding: 36px 10px;">
      <div style="font-size:48px;">👾🔥</div>
      <h1>مرحباً بكم في صراع الوحوش</h1>
      <p class="muted">جاري تجهيز الدخول إلى صفحة تكوين الفريق...</p>
      <div id="countdownTimer" class="timer-box">30</div>
      <div class="muted">سيتم الانتقال تلقائياً إلى صفحة تكوين الفريق عند وصول العداد إلى 0</div>
      <button type="button" class="btn btn-dark" onclick="openTeamScreen()">دخول مباشر لتكوين الفريق</button>
    </div>

    <!-- الشاشة 2: تكوين الفريق -->
    <div id="s2" style="display:none;">
      <h2>كون فريق من 1 إلى 5 أفراد</h2>

      <div class="row-2">
        <button type="button" id="btnSolo" class="btn btn-dark" onclick="setMode('solo')">لعب فردي (1)</button>
        <button type="button" id="btnTeam" class="btn btn-gold" onclick="setMode('team')">فريق (من 1 إلى 5)</button>
      </div>

      <label>اسم الفريق</label>
      <input type="text" id="teamName" placeholder="اكتب اسم الفريق">

      <label>عدد أفراد المجموعة (من 1 إلى 5)</label>
      <select id="memberCountSelect" onchange="changeMemberCount(this.value)">
        <option value="1">1 فرد</option>
        <option value="2">2 أفراد</option>
        <option value="3">3 أفراد</option>
        <option value="4">4 أفراد</option>
        <option value="5" selected>5 أفراد</option>
      </select>

      <div id="membersList" style="margin-top:10px;"></div>
      <div id="err2" class="msg-err"></div>
      <button type="button" class="btn btn-gold" onclick="validateTeam()">التالي</button>
    </div>
  </div>

  <script>
    let secondsLeft = 30;
    let playMode = 'team';
    let memberCount = 5;

    function openTeamScreen() {
      clearInterval(timer);
      document.getElementById('s1').style.display = 'none';
      document.getElementById('s2').style.display = 'block';
    }

    const timer = setInterval(function () {
      secondsLeft = secondsLeft - 1;
      const el = document.getElementById('countdownTimer');
      if (el) {
        el.textContent = String(Math.max(0, secondsLeft));
      }
      if (secondsLeft <= 0) {
        openTeamScreen();
      }
    }, 1000);

    function renderMembers() {
      const wrap = document.getElementById('membersList');
      const count = playMode === 'solo' ? 1 : memberCount;
      wrap.innerHTML = '';
      for (let i = 0; i < count; i++) {
        const div = document.createElement('div');
        div.className = 'member-box';
        div.innerHTML =
          '<label style="margin-top:0;">عضو (' + (i + 1) + ')</label>' +
          '<div class="row-2">' +
            '<input type="text" class="m-name" placeholder="الاسم">' +
            '<input type="tel" class="m-phone" placeholder="رقم التلفون">' +
          '</div>';
        wrap.appendChild(div);
      }
      document.getElementById('memberCountSelect').value = String(count);
      document.getElementById('memberCountSelect').disabled = playMode === 'solo';
    }

    function setMode(mode) {
      playMode = mode;
      if (mode === 'solo') memberCount = 1;
      document.getElementById('btnSolo').className = 'btn ' + (mode === 'solo' ? 'btn-gold' : 'btn-dark');
      document.getElementById('btnTeam').className = 'btn ' + (mode === 'team' ? 'btn-gold' : 'btn-dark');
      renderMembers();
    }

    function changeMemberCount(val) {
      memberCount = Math.min(5, Math.max(1, Number(val) || 1));
      renderMembers();
    }

    function validateTeam() {
      const err = document.getElementById('err2');
      const name = document.getElementById('teamName').value.trim();
      const firstMember = document.querySelector('.m-name');
      const firstPhone = document.querySelector('.m-phone');

      if (!name) {
        err.textContent = 'من فضلك اكتب اسم الفريق.';
        return;
      }
      if (!firstMember.value.trim() || !firstPhone.value.trim()) {
        err.textContent = 'من فضلك اكتب اسم ورقم تلفون العضو الأول.';
        return;
      }
      err.textContent = '';
      alert('تم تجهيز فريق: ' + name + ' بنجاح!');
    }

    renderMembers();
  </script>
</body>
</html>
