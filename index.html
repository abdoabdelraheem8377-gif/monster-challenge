<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي الوحوش</title>
  <style>
    body {
      margin: 0;
      padding: 15px;
      background: #07040F;
      color: #FFFFFF;
      font-family: Tahoma, Arial, sans-serif;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      background: #140D24;
      border: 1px solid #FFD70055;
      border-radius: 14px;
      padding: 18px;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .gear-btn {
      background: #291C47;
      color: #FFD700;
      border: 1px solid #FFD70066;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.08s ease;
    }
    .gear-btn:active { transform: scale(0.95); }
    .audio-panel {
      display: none;
      background: #1E1436;
      border: 1px solid #FFD70077;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    h1, h2, h3 {
      text-align: center;
      color: #FFD700;
      margin-top: 0;
    }
    .center { text-align: center; }
    .muted { color: #C2B8D9; font-size: 14px; line-height: 1.6; }
    .timer-box {
      font-size: 36px;
      font-weight: bold;
      color: #FFD700;
      background: #1E1436;
      border: 1px solid #FFD70088;
      border-radius: 12px;
      padding: 10px 22px;
      display: inline-block;
      margin: 14px auto;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-size: 14px;
      color: #FFE99E;
    }
    input[type="text"], input[type="tel"], select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #433269;
      background: #090512;
      color: #FFFFFF;
      font-size: 15px;
      font-family: Tahoma, Arial, sans-serif;
    }
    textarea {
      min-height: 76px;
      resize: vertical;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #FFD700;
      cursor: pointer;
    }
    .row-2 {
      display: flex;
      gap: 8px;
    }
    .row-2 > * { flex: 1; }
    .member-box {
      background: #1E1436;
      border: 1px solid #392861;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .phones-3-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0;
    }
    .phone-option {
      background: #1E1436;
      border: 1px solid #493575;
      border-radius: 9px;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #FFD700;
      direction: ltr;
      text-align: center;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    .phone-option:active { transform: scale(0.97); }
    .phone-option.active {
      background: #FFD700;
      color: #07040F;
      border-color: #FFD700;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
    }
    .btn:active:not(:disabled) {
      transform: scale(0.96);
      filter: brightness(0.9);
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-gold {
      background: #FFD700;
      color: #07040F;
      box-shadow: 0 3px 0 #B89600;
    }
    .btn-gold:active:not(:disabled) { box-shadow: 0 1px 0 #B89600; }
    .btn-dark {
      background: #291C47;
      color: #FFFFFF;
      border: 1px solid #4B367A;
      box-shadow: 0 3px 0 #160E29;
    }
    .btn-dark:active:not(:disabled) { box-shadow: 0 1px 0 #160E29; }
    .btn-green {
      background: #1FA855;
      color: #FFFFFF;
      box-shadow: 0 3px 0 #126934;
    }
    .box-card {
      background: #1D1333;
      border: 1px solid #3A2961;
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      background: #1E1436;
      border: 1px solid #FFD70055;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .coin-item, .key-item {
      background: #140D24;
      border: 1px solid #493575;
      border-radius: 9px;
      padding: 10px;
      margin-top: 8px;
    }
    .call-chip {
      display: inline-block;
      background: #291C47;
      border: 1px solid #FFD70066;
      color: #FFD700;
      padding: 5px 10px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      margin: 4px 2px;
      direction: ltr;
    }
    .msg-err {
      color: #FF7A90;
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
    }
    .msg-ok {
      color: #6EE7A8;
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
    }
    img.preview {
      max-width: 100%;
      max-height: 240px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }
    .order-form-box {
      text-align: right;
      margin-top: 12px;
      background: #140D24;
      border: 1px solid #493575;
      border-radius: 10px;
      padding: 12px;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="wrap">

    <div class="top-bar">
      <button type="button" class="gear-btn" onclick="toggleAudioPanel()">⚙️ إعدادات الصوت</button>
    </div>

    <div id="audioPanel" class="audio-panel">
      <h3 style="margin-bottom:8px;">🔊 إعدادات الصوت</h3>
      <label style="margin-top:4px;">الموسيقى الحماسية: <span id="musicVolLabel">100%</span></label>
      <input type="range" id="musicVolRange" min="0" max="100" value="100" oninput="setMusicVolume(this.value)">

      <label>أصوات المفاتيح والأزرار: <span id="sfxVolLabel">100%</span></label>
      <input type="range" id="sfxVolRange" min="0" max="100" value="100" oninput="setSfxVolume(this.value)">

      <button type="button" class="btn btn-gold" onclick="toggleHypeMusic()">🎵 تشغيل / إيقاف الموسيقى الحماسية</button>
    </div>

    <!-- 1. الشاشة الأولى: مؤقت 30 ثانية ينقل تلقائياً عند الصفر بدون زرار دخول -->
