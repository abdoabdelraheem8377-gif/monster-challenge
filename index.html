<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي الوحوش</title>
  <style>
    body {
      margin: 0;
      padding: 15px;
      background: #07040F;
      color: #FFFFFF;
      font-family: Tahoma, Arial, sans-serif;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      background: #140D24;
      border: 1px solid #FFD70055;
      border-radius: 14px;
      padding: 18px;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }
    .gear-btn {
      background: #291C47;
      color: #FFD700;
      border: 1px solid #FFD70066;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .audio-panel {
      display: none;
      background: #1E1436;
      border: 1px solid #FFD70077;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    h1, h2, h3 {
      text-align: center;
      color: #FFD700;
      margin-top: 0;
    }
    .center { text-align: center; }
    .muted { color: #C2B8D9; font-size: 14px; line-height: 1.6; }
    .timer-box {
      font-size: 36px;
      font-weight: bold;
      color: #FFD700;
      background: #1E1436;
      border: 1px solid #FFD70088;
      border-radius: 12px;
      padding: 10px 22px;
      display: inline-block;
      margin: 14px auto;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-size: 14px;
      color: #FFE99E;
    }
    input[type="text"], input[type="tel"], select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #433269;
      background: #090512;
      color: #FFFFFF;
      font-size: 15px;
      font-family: Tahoma, Arial, sans-serif;
    }
    textarea {
      min-height: 76px;
      resize: vertical;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #FFD700;
      cursor: pointer;
    }
    .row-2 {
      display: flex;
      gap: 8px;
    }
    .row-2 > * { flex: 1; }
    .member-box {
      background: #1E1436;
      border: 1px solid #392861;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .phones-3-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0;
    }
    .phone-option {
      background: #1E1436;
      border: 1px solid #493575;
      border-radius: 9px;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #FFD700;
      direction: ltr;
      text-align: center;
      cursor: pointer;
    }
    .phone-option.active {
      background: #FFD700;
      color: #07040F;
      border-color: #FFD700;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-gold {
      background: #FFD700;
      color: #07040F;
    }
    .btn-dark {
      background: #291C47;
      color: #FFFFFF;
      border: 1px solid #4B367A;
    }
    .btn-green {
      background: #1FA855;
      color: #FFFFFF;
    }
    .box-card {
      background: #1D1333;
      border: 1px solid #3A2961;
      border-radius: 10px;
      padding: 12px;
      margin: 10px 0;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      background: #1E1436;
      border: 1px solid #FFD70055;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .coin-item, .key-item, .menu-check-item {
      background: #140D24;
      border: 1px solid #493575;
      border-radius: 9px;
      padding: 10px;
      margin-top: 8px;
    }
    .menu-check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .menu-check-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #FFD700;
      cursor: pointer;
    }
    .call-chip {
      display: inline-block;
      background: #291C47;
      border: 1px solid #FFD70066;
      color: #FFD700;
      padding: 5px 10px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      margin: 4px 2px;
      direction: ltr;
    }
    .msg-err {
      color: #FF7A90;
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
    }
    .msg-ok {
      color: #6EE7A8;
      text-align: center;
      font-size: 13px;
      margin-top: 8px;
    }
    .alert-banner {
      background: #241642;
      border: 1px solid #FFD70088;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }
    img.preview {
      max-width: 100%;
      max-height: 240px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }
    .order-form-box {
      text-align: right;
      margin-top: 12px;
      background: #140D24;
      border: 1px solid #493575;
      border-radius: 10px;
      padding: 12px;
    }
    .test-bar {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px dashed #3A2961;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .test-bar button {
      flex: 1 1 30%;
      padding: 7px 8px;
      font-size: 12px;
      margin-top: 0;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="wrap">

    <div class="top-bar">
      <button type="button" class="gear-btn" onclick="toggleAudioPanel()">⚙️ إعدادات الصوت</button>
    </div>

    <div id="audioPanel" class="audio-panel">
      <h3 style="margin-bottom:8px;">🔊 إعدادات الصوت</h3>
      <label style="margin-top:4px;">الموسيقى الحماسية: <span id="musicVolLabel">100%</span></label>
      <input type="range" id="musicVolRange" min="0" max="100" value="100" oninput="setMusicVolume(this.value)">

      <label>أصوات المفاتيح والأزرار: <span id="sfxVolLabel">100%</span></label>
      <input type="range" id="sfxVolRange" min="0" max="100" value="100" oninput="setSfxVolume(this.value)">

      <button type="button" class="btn btn-gold" onclick="toggleHypeMusic()">🎵 تشغيل / إيقاف الموسيقى الحماسية</button>
    </div>

    <!-- بنر التحدي القادم والرسائل العامة من الأدمن -->
    <div id="scheduleBanner" class="alert-banner"></div>
    <div id="broadcastBanner" class="alert-banner" style="border-color:#6EE7A888;"></div>

    <!-- الشاشة 1: الدخول والعد التنازلي -->
    <div id="s1" style="display:block;">
      <div class="center" style="padding: 35px 10px;">
        <div style="font-size:48px;">👾🔥</div>
        <h1>تحدي الوحوش</h1>
        <p class="muted">جاري الدخول...</p>
        <div id="countdownTimer" class="timer-box">30</div>
        <div class="muted">ستبدأ اللعبة تلقائياً عندما يصل المؤقت إلى 0</div>
        <button type="button" class="btn btn-gold" onclick="showScreen('s2')">دخول مباشر للإعدادات</button>
      </div>
    </div>

    <!-- الشاشة 2: الإعدادات والفريق -->
    <div id="s2" style="display:none;">
      <h2>الإعدادات</h2>
      <div class="row-2">
        <button type="button" id="btnSolo" class="btn btn-dark" onclick="setMode('solo')">لعب فردي</button>
        <button type="button" id="btnTeam" class="btn btn-gold" onclick="setMode('team')">فريق (حتى 5)</button>
      </div>

      <label>اسم الفريق</label>
      <input type="text" id="teamName" placeholder="اكتب اسم الفريق">

      <div id="membersList" style="margin-top:10px;"></div>
      <button type="button" id="btnAddMember" class="btn btn-dark" onclick="addMember()">+ إضافة عضو (الحد الأقصى 5)</button>

      <div id="err2" class="msg-err"></div>
      <button type="button" class="btn btn-gold" onclick="goStep3()">التالي</button>
    </div>

    <!-- الشاشة 3: الاشتراك والإيصال -->
    <div id="s3" style="display:none;">
      <h2>الاشتراك في التحدي</h2>
      <div class="box-card center">
        <div>ارسل <strong>100</strong> جنيه إلى أحد أرقام الموبايلات التالية:</div>
        <div id="payPhonesList" class="phones-3-box"></div>
        <div class="muted" style="margin-top:6px;">لاعب واحد يبعت الاشتراك (100 جنيه)</div>
      </div>

      <label>صورة الإيصال (اختر من الاستديو أو صوّر بالكاميرا)</label>
      <input type="file" id="galleryInput" accept="image/*" style="display:none;">
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

      <div class="row-2">
        <button type="button" class="btn btn-gold" onclick="document.getElementById('galleryInput').click()">🖼️ الاستديو</button>
        <button type="button" class="btn btn-dark" onclick="document.getElementById('cameraInput').click()">📷 الكاميرا</button>
      </div>
      <div id="receiptFileName" class="muted" style="margin-top:6px;text-align:center;"></div>
      <img id="receiptPreview" class="preview" alt="صورة الإيصال">

      <div id="err3" class="msg-err"></div>
      <button type="button" id="submitBtn" class="btn btn-gold" onclick="submitRegistration()">إرسال طلب الاشتراك</button>
      <button type="button" class="btn btn-dark" onclick="showScreen('s2')">رجوع</button>
    </div>

    <!-- الشاشة 4: انتظار المراجعة -->
    <div id="s4" style="display:none;">
      <div class="center" style="padding: 30px 10px;">
        <div style="font-size:44px
